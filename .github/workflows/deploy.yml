name: Deploy to NameHero Staging

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MACBOOK_NAMEHERO }}

      - name: Add NameHero host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.NAMEHERO_PORT }} ${{ secrets.NAMEHERO_HOST }} >> ~/.ssh/known_hosts

      - name: Create lightweight deploy archive
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude=.git \
            --exclude=.github \
            --exclude=.ddev \
            --exclude=vendor \
            --exclude=node_modules \
            --exclude=web/core \
            --exclude=web/modules/contrib \
            --exclude=web/themes/contrib \
            --exclude=web/profiles/contrib \
            --exclude=web/sites/default/settings.php \
            --exclude=web/sites/default/services.yml \
            --exclude='*.sql' \
            --exclude='*.sql.gz' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.zip' \
            --exclude='web/sites/default/files/*' \
            --exclude=web/sites/default/private \
            --exclude=web/sites/default/settings.php.save \
            --exclude=web/sites/default/settings.local.php \
            --exclude=web/sites/default/settings.ddev.php \
            --exclude=local-db.sql.gz \
            --exclude=local-db.sql \
            --exclude=backup-before-import.sql.gz \
            .

      - name: Upload archive2
        run: |
          scp \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -P ${{ secrets.NAMEHERO_PORT }} \
            /tmp/deploy.tar.gz \
            ${{ secrets.NAMEHERO_USER }}@${{ secrets.NAMEHERO_HOST }}:/home/bwtfcom/stage.bwtf.com/deploy.tar.gz

      - name: Extract, install Composer dependencies, and run Drupal commands
        run: |
          ssh -p ${{ secrets.NAMEHERO_PORT }} ${{ secrets.NAMEHERO_USER }}@${{ secrets.NAMEHERO_HOST }} '
            set -ex

            whoami
            pwd
            ls -la /home/bwtfcom/stage.bwtf.com/deploy.tar.gz || echo "deploy.tar.gz check failed"

            cd /home/bwtfcom/stage.bwtf.com

            if [ -d web/sites/default ]; then
              chmod u+w web/sites/default
              chmod u+w web/sites/default/*.php web/sites/default/*.yml || true
            fi

            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            /opt/alt/php83/usr/bin/php composer.phar install --no-dev --optimize-autoloader --no-interaction

            # Keep anything that would be lost when config is imported. First
            # back up stage config and log what differs from the repository,
            # which shows edits made in the admin UI and never exported.
            BACKUPS=/home/bwtfcom/backups
            CONFIG_BACKUP=$BACKUPS/config-pre-deploy-$(date +%Y%m%d-%H%M%S)
            SLIDER_FILE=$BACKUPS/slider-pre-deploy.json
            mkdir -p $BACKUPS
            vendor/bin/drush config:status --state=Different || true
            vendor/bin/drush config:export --destination=$CONFIG_BACKUP -y || true
            ls -dt $BACKUPS/config-pre-deploy-* | tail -n +6 | xargs -r rm -rf

            # The content sync writes the production slider into
            # bwtf.settings; save it so cim does not put the repo copy back.
            rm -f $SLIDER_FILE
            vendor/bin/drush scr web/modules/custom/bwtf_content_sync/scripts/bwtf_preserve_config.php -- --save=$SLIDER_FILE || echo "Slider save failed; slider will not be restored"

            vendor/bin/drush updb -y
            vendor/bin/drush cim -y

            if [ -f $SLIDER_FILE ]; then
              vendor/bin/drush scr web/modules/custom/bwtf_content_sync/scripts/bwtf_preserve_config.php -- --restore=$SLIDER_FILE
            fi

            vendor/bin/drush cr
            vendor/bin/drush state:set system.maintenance_mode 0 --input-format=integer
            vendor/bin/drush cr
          '
