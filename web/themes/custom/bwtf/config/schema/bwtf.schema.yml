# Schema for the configuration files of the BWTF theme.

bwtf.settings:
  type: theme_settings
  label: 'BWTF theme settings'
  mapping:
    slider_display:
      type: boolean
      label: 'Show slider'
    slider_aspect:
      type: string
      label: 'Slider aspect ratio'
    slider_style:
      type: string
      label: 'Slider view'
    slider_overlay_preset:
      type: string
      label: 'Slider overlay preset'
    slider_overlay_from:
      type: string
      label: 'Slider overlay color (from)'
    slider_overlay_to:
      type: string
      label: 'Slider overlay color (to)'
    slider_autoplay_delay:
      type: integer
      label: 'Slider autoplay delay (ms)'
    slide1_title:
      type: string
      label: 'Slide 1 title'
    slide1_desc:
      type: string
      label: 'Slide 1 description'
    slide1_url:
      type: string
      label: 'Slide 1 URL'
    slide1_link_text:
      type: string
      label: 'Slide 1 link text'
    slide1_image:
      type: sequence
      label: 'Slide 1 image'
      sequence:
        type: integer
        label: 'File ID'
